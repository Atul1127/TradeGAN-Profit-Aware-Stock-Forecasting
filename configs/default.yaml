# Default TradeGAN experiment configuration
# Override values in an experiment-specific config when needed.

data:
  ticker: TCS
  benchmark: ^CNXIT
  start_date: "2010-01-01"
  end_date: "2021-12-31"
  train_ratio: 0.8
  validation_ratio: 0.1
  lookback: 10
  prediction_horizon: 1
  stride: 1

model:
  latent_dim: 8
  generator_hidden_dim: 8
  discriminator_hidden_dim: 8
  tanh_coefficient: 100

training:
  gan_epochs: 100
  lstm_epochs: 500
  batch_size: 100
  generator_lr: 0.0001
  discriminator_lr: 0.0001
  discriminator_steps: 1
  gradient_samples: 25
  checkpoint_every: 20

experiment:
  seed: 42
  device: auto
  save_plots: true
  output_dir: results
