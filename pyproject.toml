[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradegan"
version = "0.1.0"
description = "Profit-aware stock forecasting with a Fin-GAN style conditional GAN"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "tqdm",
    "torch",
    "matplotlib",
    "scikit-learn",
    "yfinance",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
